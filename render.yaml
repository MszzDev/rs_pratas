# Blueprint do Render — banco, API e tela, para ambiente de TESTES.
#
# Um clique em New → Blueprint provisiona os três. O que você precisa preencher
# à mão depois do primeiro deploy são só dois endereços, porque cada um só
# existe depois que o outro sobe (ver DEPLOY.md).
#
# Isto NÃO é produção. Três limitações que valem saber antes de mostrar:
#   - o plano gratuito hiberna a API depois de ~15 min parada, e o primeiro
#     acesso seguinte demora quase um minuto;
#   - o banco gratuito do Render expira depois de um tempo — confira o prazo
#     atual no painel;
#   - o banco vem com UMA role só, então a separação app_owner/app_rw não
#     existe aqui. A imutabilidade da auditoria e do ponto continua valendo:
#     ela é garantida por TRIGGER, que barra até uma role dona do schema (há
#     teste provando isso). O que se perde é a segunda camada, o REVOKE.
#     Para produção, use um banco com as duas roles — scripts/setup-roles-managed.sql.

databases:
  - name: rs-pratas-db
    plan: free
    databaseName: rs_pratas
    user: rs_pratas

services:
  - type: web
    name: rs-pratas-api
    runtime: node
    plan: free
    # Sem `corepack enable`: o Render ja traz o pnpm em /usr/bin, e o corepack
    # tenta substituir esse arquivo num sistema somente-leitura — falha com
    # EROFS antes de instalar qualquer coisa.
    #
    # --prod=false e obrigatorio: com NODE_ENV=production o pnpm pula as
    # devDependencies, e o compilador (tsc) mora exatamente la. Sem isto o
    # build falha em "tsc: not found".
    #
    # `turbo run build` em vez de compilar so a API: o pacote @rs-pratas/shared
    # precisa ser compilado ANTES, senao o processo sobe e morre na hora
    # tentando importar TypeScript que o Node nao le. O turbo conhece essa
    # ordem; o --filter sozinho, nao.
    #
    # A migração NÃO roda aqui: o ambiente de build não alcança o banco
    # privado. Ela acontece no boot, depois de a porta abrir — ver
    # RUN_MIGRATIONS_ON_BOOT.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@rs-pratas/api
    # Só liga o servidor. A porta abre em milissegundos e o Render fica
    # satisfeito; o schema é aplicado logo em seguida, de dentro do processo.
    startCommand: cd apps/api && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Migra e semeia ao subir, porque o build do Render não alcança o banco
      # privado. Sem isto o banco fica com tabelas e sem perfis, e ninguém entra.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      # Lojas, produtos e contas de teste. TIRE esta linha quando o sistema
      # deixar de ser demonstração e passar a atender a loja de verdade.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rs-pratas-db
          property: connectionString
      # Mesma conexão: o banco gratuito tem uma role só. Ver o aviso no topo.
      - key: DATABASE_MIGRATE_URL
        fromDatabase:
          name: rs-pratas-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # PREENCHA depois do primeiro deploy com a URL da tela. Sem isto o
      # navegador bloqueia toda chamada da tela para a API, e o sistema abre
      # mas não funciona.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: rs-pratas-web
    runtime: static
    # Mesmos motivos do serviço acima: sem corepack, e com as devDependencies
    # (o Vite é uma delas).
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@rs-pratas/web
    staticPublishPath: apps/web/dist
    envVars:
      # PREENCHA com a URL da API. Precisa estar definido no BUILD: o Vite
      # embute o valor no pacote, não lê em tempo de execução — mudar depois
      # exige um novo deploy da tela.
      - key: VITE_API_URL
        sync: false
    routes:
      # A navegação é do React Router: sem esta regra, recarregar em /venda
      # devolve 404, porque não existe arquivo com esse nome.
      - type: rewrite
        source: /*
        destination: /index.html
