name: rs-pratas

services:
  postgres:
    image: postgres:16-alpine
    container_name: rs-pratas-fase1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rs_pratas_fase1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - rs-pratas-fase1-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rs-pratas-fase1-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  rs-pratas-fase1-postgres-data:
